name: Database task

# One-off database work, run from the Actions tab.
#
# The direct `db.<ref>.supabase.co` host is IPv6-only and unreachable from many
# networks, so migrations and the obligation backfill can be hard to run from a
# laptop. This runner already reaches the database — it is the same environment
# and the same secret the nightly backup uses.
#
# Read-only tasks (coverage, backfill-dry-run) run on request. Anything that
# writes also requires `confirm: yes`, so a misclick cannot alter the database.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        default: coverage
        options:
          - coverage              # read-only · per-account transaction coverage
          - balances              # read-only · derived vs stored balance, and drift
          - suggest-obligations   # read-only · what actually repeats, from all history
          - recent-dates          # read-only · the actual dates behind each candidate
          - inspect               # read-only · full rows matching `pattern`
          - backfill-dry-run      # read-only · what the backfill would create
          - migrate-018           # writes · declared obligations schema
          - backfill-apply        # writes · create obligations, link transactions
          - migrate-020           # writes · anchored account balances
          - migrate-019           # writes · retire is_recurring (do this last)
      pattern:
        description: "For inspect — text to match in a description (case-insensitive)"
        type: string
        required: false
        default: ""
      confirm:
        description: "Type yes to allow a task that writes"
        type: string
        required: false
        default: ""

concurrency:
  group: db-task
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard write tasks
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$TASK" in
            coverage|backfill-dry-run)
              echo "::notice::$TASK is read-only." ;;
            balances|suggest-obligations|recent-dates|inspect)
              echo "::notice::$TASK is read-only." ;;
            *)
              if [ "$CONFIRM" != "yes" ]; then
                echo "::error::$TASK writes to the database. Re-run with confirm: yes"
                exit 1
              fi
              echo "::warning::$TASK will write to the live database." ;;
          esac

      - name: Check a backup exists before writing
        if: ${{ inputs.task != 'coverage' && inputs.task != 'backfill-dry-run' }}
        run: |
          set -euo pipefail
          git fetch origin db-backups --depth=1 2>/dev/null || true
          newest=$(git ls-tree -r origin/db-backups --name-only 2>/dev/null \
                   | grep 'sql.gz.gpg' | sort | tail -1 || true)
          if [ -z "$newest" ]; then
            echo "::error::No backup found on the db-backups branch. Run the Nightly DB backup workflow first."
            exit 1
          fi
          echo "Most recent backup: $newest"
          # The stamp is the filename, so a stale backup is visible at a glance.
          echo "::notice::Newest backup is $newest"

      - name: Install PostgreSQL 17 client
        if: ${{ startsWith(inputs.task, 'migrate') || inputs.task == 'coverage' || inputs.task == 'balances' || inputs.task == 'suggest-obligations' || inputs.task == 'recent-dates' || inputs.task == 'inspect' }}
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Set up Node
        if: ${{ startsWith(inputs.task, 'backfill') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ startsWith(inputs.task, 'backfill') }}
        run: npm ci --omit=optional

      - name: Per-account transaction coverage
        if: ${{ inputs.task == 'coverage' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '── Per-account coverage ──'
          select a.name, a.currency,
                 count(t.id)                            as txns,
                 min(t.occurred_at)::date               as oldest,
                 max(t.occurred_at)::date               as newest,
                 count(*) filter (where t.is_recurring) as recurring
            from accounts a
            left join transactions t
              on t.account_id = a.id and t.status not in ('ghost','duplicate')
           where a.is_active
           group by a.name, a.currency
           order by newest nulls first;

          \echo '── Recurring series, by how recently they were paid ──'
          select t.description,
                 count(*)                 as payments,
                 max(t.occurred_at)::date as last_paid,
                 (current_date - max(t.occurred_at)::date) as days_ago
            from transactions t
           where t.is_recurring and t.status not in ('ghost','duplicate')
           group by t.description
           order by last_paid desc;

          \echo '── Has migration 018 been applied? ──'
          select exists (
            select 1 from information_schema.columns
             where table_name = 'transactions' and column_name = 'obligation_id'
          ) as migration_018_applied;
          SQL

      - name: Balance check
        if: ${{ inputs.task == 'balances' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '── Derived vs stored balance ──'
          \echo 'Migration 020 back-computes the anchor, so drift must be 0.00 on every'
          \echo 'account the moment it lands. Anything else means a rounding or scope bug.'
          with derived as (
            select a.id, a.name, a.currency, a.balance as stored, a.opening_balance,
                   a.opening_balance + coalesce((
                     select sum(t.amount) from transactions t
                      where t.account_id = a.id
                        and t.status not in ('ghost','duplicate')), 0) as computed
              from accounts a
          )
          select name, currency, stored, opening_balance, computed,
                 round(computed - stored, 2) as drift
            from derived
           order by abs(computed - stored) desc, name;

          \echo '── Any account where the two disagree ──'
          select count(*) as accounts_with_drift
            from (
              select a.id,
                     a.opening_balance + coalesce((
                       select sum(t.amount) from transactions t
                        where t.account_id = a.id
                          and t.status not in ('ghost','duplicate')), 0) - a.balance as d
                from accounts a
            ) x
           where abs(d) > 0.005;
          SQL

      - name: Suggest obligations
        if: ${{ inputs.task == 'suggest-obligations' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo 'What actually repeats, across every transaction — not just the ones'
          \echo 'flagged is_recurring. Bank descriptions vary ("NETFLIX.COM" vs'
          \echo '"NETFLIX.COM, VANCOUVER, BC"), so they are matched on letters only.'
          \echo ''
          with norm as (
            select btrim(substring(regexp_replace(lower(t.description), '[^a-z ]', '', 'g')
                                   from 1 for 18)) as key,
                   t.description, t.amount, t.occurred_at, a.currency
              from transactions t
              left join accounts a on a.id = t.account_id
             where t.status not in ('ghost','duplicate')
               and t.type <> 'transfer'
               and length(btrim(regexp_replace(lower(t.description), '[^a-z ]', '', 'g'))) > 2
          ),
          seq as (
            select key, occurred_at,
                   lag(occurred_at) over (partition by key order by occurred_at) as prev
              from norm
          ),
          gaps as (
            select key, extract(epoch from (occurred_at - prev)) / 86400 as gap
              from seq where prev is not null
          ),
          cadence as (
            select key, round(percentile_cont(0.5) within group (order by gap)::numeric) as days
              from gaps group by key
          )
          select n.key,
                 count(*)                                                   as times,
                 max(n.currency)                                            as cur,
                 round(percentile_cont(0.5) within group (order by abs(n.amount))::numeric, 2) as typical,
                 c.days                                                     as gap_days,
                 case
                   when c.days between  5 and  10 then 'weekly'
                   when c.days between 11 and  17 then 'biweekly'
                   when c.days between 18 and  24 then 'semimonthly'
                   when c.days between 25 and  45 then 'monthly'
                   when c.days between 70 and 110 then 'quarterly'
                   when c.days between 300 and 400 then 'yearly'
                   else '—'
                 end                                                        as cadence,
                 min(n.occurred_at)::date                                   as first_seen,
                 max(n.occurred_at)::date                                   as last_seen,
                 (current_date - max(n.occurred_at)::date)                  as days_ago,
                 case when max(n.amount) < 0 then 'expense' else 'income' end as kind
            from norm n
            join cadence c on c.key = n.key
           group by n.key, c.days
          having count(*) >= 3
             and c.days between 5 and 400
           order by kind, c.days, times desc;
          SQL

      - name: Recent dates per candidate
        if: ${{ inputs.task == 'recent-dates' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo 'The actual dates behind each repeating candidate still active in the'
          \echo 'last 60 days — so a declared obligation can be anchored on the day it'
          \echo 'is really due rather than the day it last happened.'
          \echo ''
          with norm as (
            select btrim(substring(regexp_replace(lower(t.description), '[^a-z ]', '', 'g')
                                   from 1 for 18)) as key,
                   t.amount, t.occurred_at, a.currency
              from transactions t
              left join accounts a on a.id = t.account_id
             where t.status not in ('ghost','duplicate') and t.type <> 'transfer'
          ),
          live as (
            select key from norm
             group by key
            having count(*) >= 3
               and (current_date - max(occurred_at)::date) <= 60
          )
          select n.key,
                 max(n.currency) as cur,
                 count(*)        as times,
                 string_agg(to_char(n.occurred_at, 'Mon DD') || ' $' ||
                            to_char(abs(n.amount), 'FM999G999D00'),
                            '  ·  ' order by n.occurred_at desc) as recent
            from (
              select key, amount, occurred_at, currency,
                     row_number() over (partition by key order by occurred_at desc) as rn
                from norm
            ) n
           where n.key in (select key from live) and n.rn <= 6
           group by n.key
           order by n.key;
          SQL

      - name: Inspect transactions
        if: ${{ inputs.task == 'inspect' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          set -euo pipefail
          if [ -z "$PATTERN" ]; then
            echo "::error::inspect needs a pattern"; exit 1
          fi
          # Bound as a psql variable, so the text is quoted as a literal rather
          # than pasted into the statement.
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1             -v pat="$PATTERN" <<'SQL'
          \echo 'Full rows — the suggestion queries truncate descriptions to 18'
          \echo 'characters, which is where two different things can look like one.'
          \echo ''
          select t.occurred_at::date as date,
                 t.description,
                 t.amount,
                 a.name     as account,
                 a.currency as cur,
                 c.name     as category,
                 t.person,
                 t.status,
                 t.is_recurring as flagged
            from transactions t
            left join accounts a   on a.id = t.account_id
            left join categories c on c.id = t.category_id
           where t.description ilike '%' || :'pat' || '%'
           order by t.occurred_at desc
           limit 60;

          \echo ''
          \echo '── Distinct descriptions and what each totals ──'
          select t.description,
                 count(*)                 as times,
                 min(t.amount)            as smallest,
                 max(t.amount)            as largest,
                 max(t.occurred_at)::date as last_seen
            from transactions t
           where t.description ilike '%' || :'pat' || '%'
           group by t.description
           order by times desc;
          SQL

      - name: Apply a migration
        if: ${{ startsWith(inputs.task, 'migrate') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          num="${TASK#migrate-}"
          file=$(ls supabase/migrations/${num}_*.sql)
          echo "Applying $file"
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          # PostgREST caches the schema; without this the app keeps reporting a
          # column it cannot find until the cache happens to refresh.
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          echo "::notice::$file applied and the PostgREST schema cache reloaded."

      - name: Backfill obligations
        if: ${{ startsWith(inputs.task, 'backfill') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ "$TASK" = "backfill-apply" ]; then
            node scripts/db/backfill-obligations.mjs --apply
          else
            node scripts/db/backfill-obligations.mjs
          fi
