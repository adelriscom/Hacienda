name: Database task

# One-off database work, run from the Actions tab.
#
# The direct `db.<ref>.supabase.co` host is IPv6-only and unreachable from many
# networks, so migrations and the obligation backfill can be hard to run from a
# laptop. This runner already reaches the database — it is the same environment
# and the same secret the nightly backup uses.
#
# Read-only tasks (coverage, backfill-dry-run) run on request. Anything that
# writes also requires `confirm: yes`, so a misclick cannot alter the database.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        default: coverage
        options:
          - coverage              # read-only · per-account transaction coverage
          - backfill-dry-run      # read-only · what the backfill would create
          - migrate-018           # writes · declared obligations schema
          - backfill-apply        # writes · create obligations, link transactions
          - migrate-020           # writes · anchored account balances
          - migrate-019           # writes · retire is_recurring (do this last)
      confirm:
        description: "Type yes to allow a task that writes"
        type: string
        required: false
        default: ""

concurrency:
  group: db-task
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard write tasks
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$TASK" in
            coverage|backfill-dry-run)
              echo "::notice::$TASK is read-only." ;;
            *)
              if [ "$CONFIRM" != "yes" ]; then
                echo "::error::$TASK writes to the database. Re-run with confirm: yes"
                exit 1
              fi
              echo "::warning::$TASK will write to the live database." ;;
          esac

      - name: Check a backup exists before writing
        if: ${{ inputs.task != 'coverage' && inputs.task != 'backfill-dry-run' }}
        run: |
          set -euo pipefail
          git fetch origin db-backups --depth=1 2>/dev/null || true
          newest=$(git ls-tree -r origin/db-backups --name-only 2>/dev/null \
                   | grep 'sql.gz.gpg' | sort | tail -1 || true)
          if [ -z "$newest" ]; then
            echo "::error::No backup found on the db-backups branch. Run the Nightly DB backup workflow first."
            exit 1
          fi
          echo "Most recent backup: $newest"
          # The stamp is the filename, so a stale backup is visible at a glance.
          echo "::notice::Newest backup is $newest"

      - name: Install PostgreSQL 17 client
        if: ${{ startsWith(inputs.task, 'migrate') || inputs.task == 'coverage' }}
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Set up Node
        if: ${{ startsWith(inputs.task, 'backfill') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ startsWith(inputs.task, 'backfill') }}
        run: npm ci --omit=optional

      - name: Per-account transaction coverage
        if: ${{ inputs.task == 'coverage' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '── Per-account coverage ──'
          select a.name, a.currency,
                 count(t.id)                            as txns,
                 min(t.occurred_at)::date               as oldest,
                 max(t.occurred_at)::date               as newest,
                 count(*) filter (where t.is_recurring) as recurring
            from accounts a
            left join transactions t
              on t.account_id = a.id and t.status not in ('ghost','duplicate')
           where a.is_active
           group by a.name, a.currency
           order by newest nulls first;

          \echo '── Recurring series, by how recently they were paid ──'
          select t.description,
                 count(*)                 as payments,
                 max(t.occurred_at)::date as last_paid,
                 (current_date - max(t.occurred_at)::date) as days_ago
            from transactions t
           where t.is_recurring and t.status not in ('ghost','duplicate')
           group by t.description
           order by last_paid desc;

          \echo '── Has migration 018 been applied? ──'
          select exists (
            select 1 from information_schema.columns
             where table_name = 'transactions' and column_name = 'obligation_id'
          ) as migration_018_applied;
          SQL

      - name: Apply a migration
        if: ${{ startsWith(inputs.task, 'migrate') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          num="${TASK#migrate-}"
          file=$(ls supabase/migrations/${num}_*.sql)
          echo "Applying $file"
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          # PostgREST caches the schema; without this the app keeps reporting a
          # column it cannot find until the cache happens to refresh.
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          echo "::notice::$file applied and the PostgREST schema cache reloaded."

      - name: Backfill obligations
        if: ${{ startsWith(inputs.task, 'backfill') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ "$TASK" = "backfill-apply" ]; then
            node scripts/db/backfill-obligations.mjs --apply
          else
            node scripts/db/backfill-obligations.mjs
          fi
